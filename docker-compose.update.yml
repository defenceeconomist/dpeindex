# Always run with a unique --project-name; no shared production network or data.
services:
  redis:
    image: redis:7.4-alpine
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  qdrant:
    image: ${DPE_UPDATE_QDRANT_IMAGE:-qdrant/qdrant:latest}
    volumes: ["qdrant-data:/qdrant/storage"]
  sync:
    image: dpe-dpe-index:latest
    working_dir: /repo
    entrypoint: ["python", "-m", "app.update_worker"]
    environment:
      REDIS_URL: redis://redis:6379/4
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - .:/repo:ro
      - ./data/update-artifacts:/repo/data/update-artifacts
      - model-cache:/models
    profiles: [workers]
  citations:
    image: dpe-dpe-citations:latest
    working_dir: /repo
    entrypoint: ["python", "-m", "app.update_worker"]
    environment:
      REDIS_URL: redis://redis:6379/4
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - .:/repo:ro
      - ./data/update-artifacts:/repo/data/update-artifacts
    profiles: [workers]
volumes:
  redis-data:
  qdrant-data:
  model-cache:
