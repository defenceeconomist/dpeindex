services:
  dpe-index:
    build: .
    container_name: dpe-index
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/4
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8789:8789"
    volumes:
      - dpe-model-cache:/app/model-cache
    networks:
      - datastores
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datastores:
    external: true
    name: shared-datastores

volumes:
  dpe-model-cache:
